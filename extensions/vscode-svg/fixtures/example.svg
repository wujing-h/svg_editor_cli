<!-- 用途：展示嵌套分组、显式 id、无 id 文本和实体转义，供后续文件标记与大纲验收。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
  <g id="flow">
    <rect id="start" x="20" y="20" width="120" height="60" fill="#4a90d9"/>
    <g id="nested">
      <text x="30" y="50">Hello &amp; SVG</text>
    </g>
  </g>
</svg>
